name: Release

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"
      - "mobile-v*"
      - "tv-v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal a publicar (auto usa las rutas modificadas)"
        type: choice
        options: [auto, all, desktop, mobile, tv]
        default: auto
      version:
        description: "Versión X.Y.Z; debe coincidir con version.properties (vacío = usarla)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channels: ${{ steps.meta.outputs.channels }}
      base: ${{ steps.meta.outputs.base }}
      head: ${{ steps.meta.outputs.head }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que el tag está sobre el HEAD de main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ACTUAL=$(git rev-parse HEAD)
          MAIN=$(git rev-parse FETCH_HEAD)
          if [ "$ACTUAL" != "$MAIN" ]; then
            echo "::error::El commit $ACTUAL no es el HEAD actual de main ($MAIN). Crea el tag sobre el último commit de main."
            exit 1
          fi

      - name: Calcular versión y canales
        id: meta
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_CHANNEL: ${{ inputs.channel || 'auto' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          python3 scripts/affected_channels.py \
            --tag "$TAG" \
            --channel "$INPUT_CHANNEL" \
            --version "$INPUT_VERSION" \
            --strict-channel \
            --json-out release-meta.json >/dev/null

          VERSION=$(jq -r '.version' release-meta.json)
          BASE=$(jq -r '.base' release-meta.json)
          HEAD=$(jq -r '.head' release-meta.json)
          CHANNELS=$(jq -c '.channels' release-meta.json)

          PROPS=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release_lib import version_from_properties; print(version_from_properties())")
          if [ "$PROPS" != "$VERSION" ]; then
            echo "::error::La release indica $VERSION, pero version.properties dice $PROPS. Sube version.properties antes de etiquetar o ejecutar."
            exit 1
          fi

          mkdir -p release-notes
          for CH in $(jq -r '.channels[]' release-meta.json); do
            python3 scripts/release_notes.py \
              --version "$VERSION" \
              --channel "$CH" \
              --base "$BASE" \
              --head "$HEAD" \
              --output "release-notes/$CH.md"
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"

          {
            echo "## Release $VERSION"
            echo ""
            echo "Canales: $CHANNELS"
            echo ""
            echo "Base: ${BASE:-historial completo} → $HEAD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar notas
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes
          if-no-files-found: error

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        channel: [mobile, tv]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ matrix.channel }}
      SELECTED: ${{ contains(needs.prepare.outputs.channels, format('"{0}"', matrix.channel)) }}
    steps:
      - name: Checkout
        if: env.SELECTED == 'true'
        uses: actions/checkout@v4

      - name: JDK 25
        if: env.SELECTED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK
        if: env.SELECTED == 'true'
        uses: android-actions/setup-android@v4
        with:
          # La v3 instala por defecto el paquete obsoleto `tools`, que Google ya no sirve.
          packages: platform-tools

      - name: Instalar plataforma Android
        if: env.SELECTED == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-37.0" \
            || sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-37"

      - name: Gradle
        if: env.SELECTED == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar firma de release
        if: env.SELECTED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
            || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Faltan los secretos de firma. Configura ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > xuper-release.jks
          {
            echo "storeFile=xuper-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          test -s xuper-release.jks

      - name: Compilar APK
        if: env.SELECTED == 'true'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew ":app-${CHANNEL}:assembleRelease" \
            -PappVersionName="$VERSION" \
            --no-daemon --console=plain

          APK=$(find "app-${CHANNEL}/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No se encontró el APK de ${CHANNEL}."
            exit 1
          fi

          mkdir -p dist
          OUT="xuper-${CHANNEL}-${VERSION}.apk"
          cp "$APK" "dist/$OUT"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$SDK/build-tools/36.0.0/apksigner"
          if [ -n "$SDK" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify "dist/$OUT"
          else
            echo "::warning::apksigner no está en $APKSIGNER; no se pudo verificar la firma."
          fi
          (cd dist && sha256sum "$OUT" > "$OUT.sha256")

      - name: Guardar APK
        if: env.SELECTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xuper-${{ matrix.channel }}-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error

  build-desktop:
    needs: prepare
    if: contains(needs.prepare.outputs.channels, '"desktop"')
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Empaquetar MSI por usuario
        shell: pwsh
        run: |
          .\gradlew.bat :desktop:packageMsi "-PappVersionName=$env:VERSION" --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar artefacto
        shell: pwsh
        run: |
          $msi = Get-ChildItem "desktop\build\compose\binaries\main\msi" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) { throw "No se generó el MSI" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = "xuper-desktop-$env:VERSION.msi"
          Copy-Item $msi.FullName "dist\$out"
          $hash = (Get-FileHash "dist\$out" -Algorithm SHA256).Hash.ToLower()
          "$hash  $out" | Set-Content -Encoding ascii "dist\$out.sha256"

      - name: Guardar MSI
        uses: actions/upload-artifact@v4
        with:
          name: xuper-desktop-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, build-android, build-desktop]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (needs.build-desktop.result == 'success' || needs.build-desktop.result == 'skipped') &&
      (needs.build-android.result == 'success' || needs.build-desktop.result == 'success')
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Descargar notas
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          pattern: xuper-*
          path: dist
          merge-multiple: true

      - name: Publicar releases por canal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNELS: ${{ needs.prepare.outputs.channels }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: |
          set -euo pipefail
          echo "Publicando $VERSION para $CHANNELS"
          echo "$CHANNELS" | jq -r '.[]' | while read -r CH; do
            case "$CH" in
              desktop) LABEL="Escritorio" ;;
              mobile) LABEL="Android" ;;
              tv) LABEL="Android TV" ;;
              *) echo "::error::Canal desconocido: $CH"; exit 1 ;;
            esac
            TAG="${CH}-v${VERSION}"
            TITLE="Xuper ${VERSION} — ${LABEL}"
            NOTES="release-notes/${CH}.md"
            test -f "$NOTES" || { echo "::error::Falta $NOTES"; exit 1; }

            if gh release view "$TAG" >/dev/null 2>&1; then
              IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
              if [ "$IS_DRAFT" != "true" ]; then
                echo "::error::La release $TAG ya está publicada. No se modifica; sube la versión."
                exit 1
              fi
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --latest=false
            else
              gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES" --draft --target "$HEAD_SHA" --latest=false
            fi

            shopt -s nullglob
            FILES=(dist/xuper-${CH}-${VERSION}.*)
            if [ ${#FILES[@]} -ne 2 ]; then
              echo "::error::Se esperaban el artefacto y su SHA-256 para $CH, pero hay ${#FILES[@]} archivo(s)."
              exit 1
            fi
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --draft=false --latest=false
          done
