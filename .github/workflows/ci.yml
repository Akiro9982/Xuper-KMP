name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3 instala por defecto el paquete obsoleto `tools`, que Google ya no sirve.
          packages: platform-tools

      - name: Instalar plataforma Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-37.0" \
            || sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-37"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar y probar
        run: |
          chmod +x gradlew
          ./gradlew \
            :core:jvmTest --tests "com.xuperclean.core.update.*" \
            :app-mobile:assembleDebug \
            :app-tv:assembleDebug \
            :desktop:compileKotlin \
            --no-daemon --console=plain
